{% extends "base.html" %}
{% block title %}Deportes{% endblock %}

{% block content %}
<div class="container">
    <h1>XportS</h1>

    <!-- Botón flotante -->
    <button id="debugBtn" class="debug-btn">⚙️ Análisis</button>

    <!-- Modal -->
    <div id="debugModal" class="debug-modal hidden">
        <div class="debug-content">
            <button id="closeDebug" class="close-btn">✖</button>
            <h2>Análisis del Sistema</h2>
            <div id="debugMetrics"></div>
        </div>
    </div>

    <div id="sportsContainer"></div>

    <script id="sports-data" type="application/json">
        {{ sports_json | safe }}
    </script>

    <script>
    const initialSports = JSON.parse(document.getElementById('sports-data').textContent);
    </script>
</div>

<style>
.debug-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #222;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    z-index: 9999;
}

.debug-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
}

.debug-modal.hidden {
    display: none;
}

.debug-content {
    background: #fff;
    width: 90%;
    max-width: 800px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    border-radius: 10px;
}

.close-btn {
    float: right;
    border: none;
    background: none;
    font-size: 20px;
    cursor: pointer;
}
</style>
{% endblock %}
